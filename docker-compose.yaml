services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noiremore-backend
    ports:
      - "5050:5050"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5050/api/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - noiremore-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: noiremore-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - noiremore-net

networks:
  noiremore-net:
    driver: bridge